name: Android app

# Builds the debug APK and runs the JVM unit tests. The instrumentation tests
# need an emulator, so they are not part of this job.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest

      - uses: actions/upload-artifact@v4
        with:
          name: pocketwiki-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
