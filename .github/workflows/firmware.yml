name: Firmware build

# Builds the ESP32-C3 and ESP32-S3 firmware and stages the flash images
# (bootloader, partitions, firmware, content) into firmware/dist/<env>/ via
# pio_post.py. Artifacts are uploaded for manual download; tagged releases
# are assembled by release.yml.
#
# The dist folder is gitignored by design: binaries live as CI artifacts and
# GitHub Release assets, not in the repository.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'firmware/**'
      - 'assets/**'
      - 'tools/**'
      - '.github/workflows/firmware.yml'
  pull_request:
    paths:
      - 'firmware/**'
      - 'assets/**'
      - 'tools/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out article content
        # Article text is CC BY-SA and lives in a separate repository. Cloning
        # it to this sibling path is what tools/content_paths.py and the
        # firmware CMake build expect by default; the content repository must
        # be publicly readable for this step.
        run: git clone --depth 1 "https://github.com/${{ github.repository_owner }}/pocketwiki-content.git" "$GITHUB_WORKSPACE/../pocketwiki-content"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Cache PlatformIO toolchains
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ runner.os }}-espressif32-7.0.1-${{ hashFiles('firmware/platformio.ini', 'firmware/dependencies.lock') }}

      - name: Build firmware (esp32-s3 + esp32-c3)
        working-directory: firmware
        # Build serially: both environments regenerate the shared managed
        # zstd component directory and concurrent builds race on its sources.
        run: |
          pio run -e esp32-s3
          pio run -e esp32-c3

      - name: Run repo Python tests
        run: python -m pytest tests/ -q

      - name: Upload staged dist images
        uses: actions/upload-artifact@v4
        with:
          name: firmware-dist
          path: firmware/dist/
          if-no-files-found: error
