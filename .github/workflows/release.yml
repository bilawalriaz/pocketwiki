name: Release

# Tagged release (v*): builds firmware for both boards and the macOS flasher
# app for both architectures, then publishes every binary to the GitHub
# Release for the tag.

on:
  push:
    tags: ['v*']

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out article content
        # Article text is CC BY-SA and lives in a separate repository; the
        # firmware build packs the built-in archive from it.
        run: git clone --depth 1 "https://github.com/${{ github.repository_owner }}/pocketwiki-content.git" "$GITHUB_WORKSPACE/../pocketwiki-content"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build firmware (esp32-s3 + esp32-c3)
        working-directory: firmware
        # Build serially: both environments regenerate the shared managed
        # zstd component directory and concurrent builds race on its sources.
        run: |
          pio run -e esp32-s3
          pio run -e esp32-c3

      - name: Bundle dist images
        working-directory: firmware
        run: |
          zip -r pocketwiki-firmware-esp32-s3.zip dist/esp32-s3 -x '*.DS_Store'
          zip -r pocketwiki-firmware-esp32-c3.zip dist/esp32-c3 -x '*.DS_Store'

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-zips
          path: |
            firmware/pocketwiki-firmware-esp32-s3.zip
            firmware/pocketwiki-firmware-esp32-c3.zip
          if-no-files-found: error

  macos-app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Build and bundle ESPFlashGUI.app
        working-directory: flasher
        run: |
          VERSION="${{ github.ref_name }}" ./scripts/bundle-macos.sh
          ditto -c -k --keepParent build/ESPFlashGUI.app PocketWiki-Flasher-macOS-${{ matrix.arch }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: flasher-macos-${{ matrix.arch }}
          path: flasher/PocketWiki-Flasher-macOS-${{ matrix.arch }}.zip
          if-no-files-found: error

  publish:
    needs: [firmware, macos-app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            release-assets/*.zip \
            --repo "${{ github.repository }}" \
            --title "PocketWiki ${{ github.ref_name }}" \
            --notes "Firmware images for the ESP32-S3 (16 MB) and ESP32-C3 (4 MB), and the macOS flasher app (arm64 + x86_64). See docs/FLASHER.md and docs/HARDWARE.md."
