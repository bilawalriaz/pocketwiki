name: Release

# Tagged release (v*): builds firmware for both boards and publishes the
# resulting archives to the GitHub Release for the tag.
#
# The firmware job needs only this repository: the built-in guide it packs
# lives in articles/pocketwiki/, and the embedded catalogue is the published
# snapshot committed under android/app/src/main/assets/.

on:
  push:
    tags: ['v*']

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Install build dependencies
        run: python -m pip install -r tools/requirements.txt

      - name: Build firmware (esp32-s3 + esp32-c3)
        working-directory: firmware
        # Build serially: both environments regenerate the shared managed
        # component directory and concurrent builds race on its sources.
        run: |
          pio run -e esp32-s3
          pio run -e esp32-c3

      - name: Bundle staged images
        working-directory: firmware
        run: |
          zip -r pocketwiki-firmware-esp32-s3.zip dist/esp32-s3 -x '*.DS_Store'
          zip -r pocketwiki-firmware-esp32-c3.zip dist/esp32-c3 -x '*.DS_Store'

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-zips
          path: |
            firmware/pocketwiki-firmware-esp32-s3.zip
            firmware/pocketwiki-firmware-esp32-c3.zip
          if-no-files-found: error

  publish:
    needs: [firmware]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            release-assets/*.zip \
            --repo "${{ github.repository }}" \
            --title "PocketWiki ${{ github.ref_name }}" \
            --notes "Firmware images for the ESP32-S3 (16 MB) and ESP32-C3 (4 MB). Flash from https://educated.space/pocketwiki in Chrome or Edge, or use tools/flash_all.py. See docs/FLASHER.md and docs/HARDWARE.md."
