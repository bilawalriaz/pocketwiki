name: Host tests

# Runs the Python test suite, which also compiles and drives the C harnesses
# for the archive decoder, title lookup, catalogue index, pack-store metadata
# and QR encoder. The catalogue tests need the article corpus, so the content
# repository is cloned before the suite runs.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - 'tests/**'
      - 'firmware/**'
      - 'assets/**'
      - '.github/workflows/tests.yml'
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out article content
        # Article text is CC BY-SA and lives in a separate repository. Cloning
        # it to this sibling path is what tools/content_paths.py expects.
        run: git clone --depth 1 "https://github.com/${{ github.repository_owner }}/pocketwiki-content.git" "$GITHUB_WORKSPACE/../pocketwiki-content"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install -r tools/requirements.txt

      - name: Run the host tests
        run: python -m pytest tests/ -q
